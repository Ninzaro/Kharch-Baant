<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-192x192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kharch Baant - Expense Tracker</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Track and split expenses with friends and family. Perfect for group trips, roommates, and shared meals." />
    <meta name="theme-color" content="hsl(239 84% 67%)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KharchBaant" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.motamaati.in/" />
    <meta property="og:title" content="Kharch Baant - Expense Tracker" />
    <meta property="og:description" content="Track and split expenses with friends and family" />
    <meta property="og:image" content="/pwa-512x512.svg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.motamaati.in/" />
    <meta property="twitter:title" content="Kharch Baant - Expense Tracker" />
    <meta property="twitter:description" content="Track and split expenses with friends and family" />
    <meta property="twitter:image" content="/pwa-512x512.svg" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/pwa-192x192.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-192x192.svg" />
    
    
    <!-- html2canvas is bundled via npm (import in components); CDN script removed to avoid tracking blocks -->
    <!-- Inline blocking script: apply theme class + theme-color before first paint (FOUC) -->
    <script>
      (function() {
        try {
          var stored = JSON.parse(localStorage.getItem('app-ui') || '{}');
          var theme = (stored.state && stored.state.theme) || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = theme === 'dark' || (theme === 'system' && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
          // Match meta theme-color to primary token (light/dark use same brand hue)
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', 'hsl(239 84% 67%)');
        } catch(e) {}
      })();
    </script>
  </head>
  <!--
    Shell surfaces are token-driven:
    - body: bg-background + text-foreground (see index.css :root / .dark)
    - #app-bg: fixed gradient layer using --app-bg-from / --app-bg-to
  -->
  <body class="font-sans bg-background text-foreground antialiased min-h-full">
    <div id="app-bg" class="fixed inset-0 -z-10 h-full w-full pointer-events-none" aria-hidden="true"></div>
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
