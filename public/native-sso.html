<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening Kharch Baant</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
      padding: 24px;
    }
    a.btn {
      display: block;
      margin-top: 24px;
      padding: 16px 24px;
      border-radius: 12px;
      background: #6366f1;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div>
    <p>Sign-in complete. Return to the app:</p>
    <a class="btn" id="open" href="kharchbaant://sso-callback">Open Kharch Baant</a>
  </div>
  <script>
    (function () {
      var q = window.location.search || '';
      var hash = window.location.hash || '';
      if (hash && hash.indexOf('#Intent') === 0) hash = '';
      var appUrl = 'kharchbaant://sso-callback' + q + hash;
      var intentUrl =
        'intent://sso-callback' +
        q +
        '#Intent;scheme=kharchbaant;package=com.kharchbaant.app;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end';
      var link = document.getElementById('open');
      link.href = intentUrl;
      link.addEventListener('click', function (e) {
        e.preventDefault();
        window.location.href = intentUrl;
        setTimeout(function () { window.location.href = appUrl; }, 300);
      });
      window.location.href = intentUrl;
    })();
  </script>
</body>
</html>
