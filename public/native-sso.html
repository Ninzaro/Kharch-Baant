<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening Kharch Baant</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
      padding: 24px;
    }
    a {
      color: #a5b4fc;
    }
  </style>
</head>
<body>
  <div>
    <p>Opening Kharch Baant…</p>
    <p><a id="open" href="kharchbaant://sso-callback">Open the app</a></p>
  </div>
  <script>
    (function () {
      var q = window.location.search || '';
      var hash = window.location.hash || '';
      var appUrl = 'kharchbaant://sso-callback' + q + hash;
      var intentUrl =
        'intent://sso-callback' +
        q +
        '#Intent;scheme=kharchbaant;package=com.kharchbaant.app;end';
      document.getElementById('open').href = appUrl;
      window.location.replace(appUrl);
      setTimeout(function () {
        window.location.replace(intentUrl);
      }, 400);
    })();
  </script>
</body>
</html>
