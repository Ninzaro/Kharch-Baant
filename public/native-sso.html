<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening Kharch Baant</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
      padding: 24px;
    }
    a.btn {
      display: inline-block;
      margin-top: 24px;
      padding: 16px 24px;
      border-radius: 12px;
      background: #6366f1;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    .muted { color: #94a3b8; font-size: 14px; }
  </style>
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="__CLERK_PUBLISHABLE_KEY__"
    src="https://clerk.motamaati.in/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
  ></script>
</head>
<body>
  <div>
    <p id="msg">Finishing sign-in…</p>
    <p class="muted" id="hint"></p>
    <a class="btn" id="open" href="kharchbaant://sso-callback" style="display:none">Open Kharch Baant</a>
  </div>
  <script>
    (function () {
      var open = document.getElementById('open');
      var msg = document.getElementById('msg');
      var hint = document.getElementById('hint');

      function suffixFromLocation(sessionId) {
        var q = window.location.search || '';
        var hash = window.location.hash || '';
        if (sessionId && q.indexOf('__clerk_created_session=') === -1 && hash.indexOf('__clerk_created_session=') === -1) {
          q += (q ? '&' : '?') + '__clerk_created_session=' + encodeURIComponent(sessionId);
        }
        return q + hash;
      }

      function appLink(sessionId) {
        return 'kharchbaant://sso-callback' + suffixFromLocation(sessionId);
      }

      function intentLink(sessionId) {
        return (
          'intent://sso-callback' +
          suffixFromLocation(sessionId) +
          '#Intent;scheme=kharchbaant;package=com.kharchbaant.app;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end'
        );
      }

      function showButton(sessionId) {
        var app = appLink(sessionId);
        var intent = intentLink(sessionId);
        open.href = intent;
        open.style.display = 'inline-block';
        open.onclick = function (e) {
          e.preventDefault();
          window.location.href = intent;
          setTimeout(function () { window.location.href = app; }, 400);
        };
        msg.textContent = 'Sign-in complete.';
        hint.textContent = 'Tap the button if the app does not open.';
        console.log('MY_SSO: bounce opening app', JSON.stringify({
          hasSessionParam: Boolean(sessionId) || /__clerk_created_session=/.test(window.location.search + window.location.hash),
          hasClerkStatus: /__clerk_status=/.test(window.location.search + window.location.hash),
        }));
        window.location.href = intent;
      }

      function waitForClerk(attempt) {
        if (window.Clerk && window.Clerk.load) {
          window.Clerk.load()
            .then(function () {
              var session = window.Clerk.session;
              if (session && session.id) {
                showButton(session.id);
                return;
              }
              window.Clerk.addListener(function (res) {
                if (res.session && res.session.id) showButton(res.session.id);
              });
              msg.textContent = 'Waiting for Clerk session…';
              hint.textContent = 'If this stays here, close Chrome and tap Get started again.';
              setTimeout(function () {
                if (window.Clerk.session && window.Clerk.session.id) {
                  showButton(window.Clerk.session.id);
                }
              }, 2000);
            })
            .catch(function (err) {
              console.error(err);
              msg.textContent = 'Could not read the Clerk session.';
              showButton(null);
            });
          return;
        }
        if (attempt > 50) {
          msg.textContent = 'Clerk did not load.';
          showButton(null);
          return;
        }
        setTimeout(function () { waitForClerk(attempt + 1); }, 100);
      }

      var params = new URLSearchParams(window.location.search);
      var querySessionId =
        params.get('__clerk_created_session') ||
        params.get('created_session_id') ||
        params.get('session_id');

      if (querySessionId) {
        showButton(querySessionId);
      } else {
        waitForClerk(0);
      }
    })();
  </script>

</body>
</html>
