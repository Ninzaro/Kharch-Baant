name: Android CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js for web build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Validate build secrets
        run: |
          if [ -z "${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" ]; then
            echo "::error::Secret VITE_CLERK_PUBLISHABLE_KEY is missing in GitHub repository secrets!"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            echo "::error::Secret VITE_SUPABASE_URL is missing in GitHub repository secrets!"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Secret VITE_SUPABASE_ANON_KEY is missing in GitHub repository secrets!"
            exit 1
          fi

      # 3. Build web assets with production env vars
      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run build

      # 4. Capacitor sync (copies dist/ → android assets)
      - name: Capacitor sync
        run: npx cap sync android

      # 5. Java + Android SDK
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Prepare signing
      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > android/app/release-key.jks

      # 7. Build signed AAB with auto-incremented versionCode
      - name: Build Release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}" \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # 8. Upload AAB as GitHub artifact (always, for debugging)
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # 9. Publish to Google Play internal testing (only on push to main).
      # Google's Publishing API often returns "The service is currently unavailable"
      # (HTTP 503) for a minute or two — retry instead of failing the whole job.
      - name: Upload to Google Play (Internal Testing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: r0adkll/upload-google-play@v1.1.5
          attempt_limit: 4
          attempt_delay: 45000
          with: |
            serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
            packageName: com.kharchbaant.app
            releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
            tracks: internal
            status: completed
            whatsNewDirectory: distribution/whatsnew